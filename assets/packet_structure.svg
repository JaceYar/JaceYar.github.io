<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(200,169,110,0.06)"/>
    </pattern>
  </defs>

  <rect width="500" height="300" fill="#161310"/>
  <rect width="500" height="300" fill="url(#dotgrid)"/>

  <!-- header -->
  <text x="24" y="30" font-family="monospace" font-size="10" letter-spacing="2" fill="#8a7048">// CAPTURED FRAME</text>
  <text x="24" y="48" font-family="monospace" font-size="9" letter-spacing="1.5" fill="#5a5140">RAW ETH FRAME - 74 BYTES</text>
  <line x1="24" y1="58" x2="476" y2="58" stroke="rgba(200,169,110,0.15)" stroke-width="1"/>

  <!-- Ethernet Header -->
  <rect x="24" y="74" width="452" height="34" fill="none" stroke="#8a7048" stroke-width="1"/>
  <text x="38" y="95" font-family="monospace" font-size="12" fill="#e8d5a8">ETHERNET HEADER</text>
  <text x="462" y="95" font-family="monospace" font-size="10" fill="#5a5140" text-anchor="end">14B</text>

  <!-- IP Header -->
  <rect x="24" y="116" width="452" height="34" fill="none" stroke="#8a7048" stroke-width="1"/>
  <text x="38" y="137" font-family="monospace" font-size="12" fill="#e8d5a8">IP HEADER</text>
  <text x="462" y="137" font-family="monospace" font-size="10" fill="#5a5140" text-anchor="end">20B</text>
  <text x="462" y="128" font-family="monospace" font-size="8" fill="#8fa04d" text-anchor="end">SRC / DST</text>

  <!-- TCP Header -->
  <rect x="24" y="158" width="452" height="34" fill="none" stroke="#8a7048" stroke-width="1"/>
  <text x="38" y="179" font-family="monospace" font-size="12" fill="#e8d5a8">TCP HEADER</text>
  <text x="462" y="179" font-family="monospace" font-size="10" fill="#5a5140" text-anchor="end">20B</text>
  <text x="462" y="170" font-family="monospace" font-size="8" fill="#8fa04d" text-anchor="end">PORT / SEQ</text>

  <!-- Payload -->
  <rect x="24" y="200" width="452" height="46" fill="rgba(200,169,110,0.05)" stroke="#c8a96e" stroke-width="1"/>
  <text x="38" y="222" font-family="monospace" font-size="12" fill="#c8a96e">PAYLOAD</text>
  <text x="462" y="222" font-family="monospace" font-size="10" fill="#8a7048" text-anchor="end">VARIABLE</text>
  <text x="38" y="238" font-family="monospace" font-size="8" fill="#5a5140">0x48 0x54 0x54 0x50 0x2f 0x31 0x2e 0x31 ...</text>

  <!-- footer status line -->
  <line x1="24" y1="262" x2="476" y2="262" stroke="rgba(200,169,110,0.15)" stroke-width="1"/>
  <circle cx="30" cy="278" r="3" fill="#8fa04d"/>
  <text x="40" y="282" font-family="monospace" font-size="9" letter-spacing="1" fill="#8fa04d">CAPTURE ACTIVE</text>
  <text x="462" y="282" font-family="monospace" font-size="9" fill="#5a5140" text-anchor="end">AF_PACKET / SOCK_RAW</text>
</svg>
